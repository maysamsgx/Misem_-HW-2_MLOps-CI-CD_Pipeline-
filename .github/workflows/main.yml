name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip' # Enable pip caching for faster installs
        
    - name: Build
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest

    - name: Unit Tests
      run: |
        pytest tests/test_features.py tests/test_modeling.py

    - name: Lint
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Component Tests
      run: |
        pytest tests/test_component.py
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Package
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: mlops-pipeline:latest
        load: true # Load image into Docker daemon so we can run it
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke Test
      run: |
        # Run container in detached mode
        docker run -d -p 8000:8000 --name mlops-service mlops-pipeline:latest
        # Wait a bit for service to come up (Handled by script retries)
        # sleep 10 removed for performance
        # Run smoke tests as a script (since it's not a standard pytest file)
        python tests/smoke_test.py
