name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Unit Tests
      run: |
        pytest tests/test_features.py tests/test_modeling.py tests/test_component.py
        
    - name: Build Docker Image
      run: |
        docker build -t mlops-pipeline .
        
    - name: Run Smoke Test
      run: |
        # Run container in detached mode
        docker run -d -p 8000:8000 --name mlops-service mlops-pipeline
        # Wait a bit for service to come up
        sleep 10
        # Run smoke tests from outside the container against the exposed port
        pytest tests/smoke_test.py
