name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1️⃣ BUILD: Environment Setup & Dependency Validation
  build:
    name: 1️⃣ Build & Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pylint httpx requests

  # 2️⃣ UNIT TEST: Fast, Isolated Verification (Commit Stage)
  unit-test:
    name: 2️⃣ Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt pytest

      - name: Run Unit Tests
        run: pytest tests/test_features.py -v

  # 3️⃣ LINT: Code Quality (Commit Stage)
  lint:
    name: 3️⃣ Linting
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt flake8 pylint

      - name: Run Flake8
        run: flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pylint
        # Enforce fail-under 8.0
        run: pylint src/ tests/ --rcfile=.pylintrc --fail-under=8.0

  # 4️⃣ COMPONENT TEST: Integration Verification (Acceptance Stage)
  component-test:
    name: 4️⃣ Component Tests
    needs: [unit-test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run Component Tests
        run: pytest tests/test_component.py -v

  # 5️⃣ PACKAGE: Docker Build via Buildx (Build Once Rule)
  package:
    name: 5️⃣ Package Docker
    needs: component-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mlops-service:${{ github.sha }}
          outputs: type=docker,dest=/tmp/mlops-service.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlops-service-image
          path: /tmp/mlops-service.tar
          retention-days: 1

  # 6️⃣ SMOKE TEST: Deployment Verification (Acceptance Stage)
  smoke-test:
    name: 6️⃣ Smoke Test
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: mlops-service-image
          path: /tmp

      - name: Load Image
        run: docker load --input /tmp/mlops-service.tar

      - name: Set up Python for Smoke Test
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Smoke Test Libs
        run: pip install requests

      - name: Run Smoke Test
        run: |
          # Cleanup potential remnants
          docker rm -f mlops-service || true

          # Start container detached (Robust Mode)
          # Run Smoke Test (Bash script is more robust)
          chmod +x tests/smoke_test.sh
          
          # Start container with explicit name
          echo "Starting container..."
          docker run -d \
            --name mlops-service \
            -p 8000:8000 \
            mlops-service:${{ github.sha }}
          
          # Debug: Verify container is running
          docker ps -a
          
          # Run the test
          ./tests/smoke_test.sh

      - name: Inspect Logs on Failure
        if: failure()
        run: |
            echo "=== CONTAINER LOGS ==="
            docker logs mlops-service || echo "No logs found (container missing?)"
            echo "=== END LOGS ==="
