# GitLab CI/CD Pipeline for MLOps Homework 2
# Repository: https://gitlab.com/maysamsgx

variables:
  DOCKER_IMAGE: "candidate-matching-service"
  VERSION: "1.0.0"

stages:
  - commit_stage      # CI: Unit Tests & Linting
  - acceptance_stage  # CD: Component Test, Build, Smoke Test
  - deploy            # Optional: Production deployment

# ==========================================
# Part 1: The Commit Stage (Continuous Integration)
# ==========================================

lint_code:
  stage: commit_stage
  image: python:3.11.9-slim
  script:
    - pip install flake8
    - echo "Running Static Code Analysis (Linting)..."
    # Fails build if there are syntax errors or undefined names
    - flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

unit_tests:
  stage: commit_stage
  image: python:3.11.9-slim
  script:
    - echo "Running Automated Unit Tests..."
    - pip install -r requirements.txt
    - pytest tests/test_features.py --verbose
    # Ensure checking feature hashing/embedding logic

# ==========================================
# Part 2: The Automated Acceptance Gate (CD)
# ==========================================

component_test:
  stage: acceptance_stage
  image: python:3.11.9-slim
  script:
    - echo "Running Component/Integration Tests..."
    - pip install -r requirements.txt
    - pytest tests/test_component.py --verbose
    # Verifies interaction between model serving logic and mock data source

build_and_smoke_test:
  stage: acceptance_stage
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker Image..."
    - docker build -t $DOCKER_IMAGE:$VERSION .
    
    - echo "Spinning up container for Smoke Test..."
    - docker run -d -p 8000:8000 --name smoke_app $DOCKER_IMAGE:$VERSION
    - sleep 10 # Wait for service to start
    
    - echo "Running Smoke Test..."
    # We need python to run the smoke test script, or we can just use curl.
    # Since we are in docker:latest, we might not have python installed easily or we can use apk.
    - apk add --no-cache python3 py3-requests
    - python3 tests/smoke_test.py http://docker:8000 || python3 tests/smoke_test.py http://localhost:8000
    # Note: In GitLab dind, localhost might refer to the runner, service might be on 'docker' hostname.
    
    - echo "Smoke Test Passed!"
    - docker stop smoke_app

# ==========================================
# Part 3: Deploy (Optional extension)
# ==========================================
deploy_to_staging:
  stage: deploy
  image: dtzar/helm-kubectl
  script:
    - echo "Deploying to Staging Environment (Kubernetes)..."
    - kubectl apply -f k8s/deployment.yaml
  only:
    - main

